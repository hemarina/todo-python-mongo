on:
  workflow_dispatch:
  push:
    # Run when commits are pushed to mainline branch (main or master)
    # Set this to the mainline branch you are using
    branches:
      - main
      - master
      - test

# Smoke test: verify Azure/setup-azd works across three refs.
# Each job runs on a fresh runner so installs don't overwrite each other.

permissions:
  id-token: write
  contents: read

jobs:
  test-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-azd@v2
      - run: azd version

  test-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-azd@main
        with:
          version: 'stable'
      - run: azd version

  test-main-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-azd@main
        with:
          version: 'daily'
      - run: azd version
      
      
  test-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Azure/setup-azd@v2.3.0
      - run: azd version
